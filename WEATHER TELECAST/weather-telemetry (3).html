<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline · Live Weather Telemetry</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#7fa8c4}
@property --c2{syntax:'<color>';inherits:true;initial-value:#e9cfa0}
@property --c3{syntax:'<color>';inherits:true;initial-value:#e7b48a}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Outfit',system-ui,sans-serif;color:#f6f3ee;
 background:linear-gradient(160deg,var(--c1),var(--c2) 55%,var(--c3));
 transition:--c1 1.6s,--c2 1.6s,--c3 1.6s;overflow-x:hidden;position:relative}
body.clear{--c1:#7fa8c4;--c2:#e9cfa0;--c3:#e2a982}
body.clouds{--c1:#7d8b9a;--c2:#a9b3be;--c3:#c9c4bd}
body.rain{--c1:#44566a;--c2:#5f7387;--c3:#7e8c97}
body.thunder{--c1:#34374d;--c2:#52506a;--c3:#6d6477}
body.snow{--c1:#9fb0c2;--c2:#cfd9e2;--c3:#e6e9ec}
body.mist{--c1:#8e9695;--c2:#b4b8b3;--c3:#cfcbc2}
body.night{--c1:#161d36;--c2:#272f55;--c3:#3b3f62}
body.night.rain,body.night.thunder,body.night.snow{--c1:#12182a;--c2:#1f2740;--c3:#2d3350}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.cloud{position:fixed;z-index:0;border-radius:50%;background:rgba(255,255,255,.16);filter:blur(38px);animation:drift linear infinite;pointer-events:none}
.cloud:nth-of-type(1){width:420px;height:150px;top:8%;left:-420px;animation-duration:95s}
.cloud:nth-of-type(2){width:540px;height:180px;top:42%;left:-540px;animation-duration:140s;animation-delay:-60s}
.cloud:nth-of-type(3){width:360px;height:120px;top:72%;left:-360px;animation-duration:110s;animation-delay:-30s}
body.night .cloud{background:rgba(160,170,210,.08)}
body.clear:not(.night) .cloud{opacity:.5}
@keyframes drift{to{transform:translateX(calc(100vw + 600px))}}
.sunglow{position:fixed;top:-160px;right:-120px;width:520px;height:520px;border-radius:50%;z-index:0;pointer-events:none;
 background:radial-gradient(circle,rgba(255,236,190,.55),rgba(255,236,190,0) 65%);opacity:0;transition:opacity 1.6s;animation:pulse 7s ease-in-out infinite}
body.clear:not(.night) .sunglow{opacity:1}
body.night::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 8%,rgba(214,222,255,.14),transparent 30%);pointer-events:none}
@keyframes pulse{50%{transform:scale(1.12)}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:28px 20px 48px}
header{position:relative;z-index:30;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;animation:rise .8s both}
.brand{font-weight:200;font-size:1.5rem;letter-spacing:.3em;text-transform:uppercase}
.brand b{font-weight:600}
form{display:flex;flex:1;min-width:260px;max-width:520px;gap:8px}
.sbox{flex:1;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:999px;background:rgba(20,28,40,.28);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.3s}
.sbox:focus-within{background:rgba(20,28,40,.42);border-color:rgba(255,255,255,.5);transform:translateY(-1px)}
#sw{flex:1;position:relative}#sw .sbox{width:100%}
#sug{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:20;list-style:none;padding:6px;border-radius:22px;background:rgba(32,40,54,.82);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 44px rgba(10,15,25,.3);display:none;animation:rise .25s both}
#sug.on{display:block}
#sug li{padding:10px 14px;border-radius:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .15s}
#sug li:hover,#sug li.act{background:rgba(255,255,255,.14)}
#sug li b{font-weight:400}#sug li small{display:block;opacity:.65;font-weight:300;font-size:.8rem;margin-top:1px}
#sug li em{font-style:normal;font-size:.72rem;letter-spacing:.12em;opacity:.7;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 9px}
#sug li.none{cursor:default;opacity:.7;justify-content:center}
input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;font-size:1.02rem;padding:14px 0}
input::placeholder{color:rgba(255,255,255,.62)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.16);border-radius:999px;padding:0 22px;backdrop-filter:blur(14px);transition:.25s}
button:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.unit{padding:0 16px;height:48px;letter-spacing:.08em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;min-height:30px;animation:rise .8s .1s both}
.chip{padding:5px 14px;font-size:.85rem;height:auto;background:rgba(20,28,40,.22)}
.glass{background:rgba(20,28,40,.26);border:1px solid rgba(255,255,255,.18);border-radius:26px;backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(10,15,25,.18)}
#app{margin-top:18px;position:relative;min-height:420px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:34px;animation:rise .8s both}
.city{font-size:2rem;font-weight:300;letter-spacing:.02em}
.sub{opacity:.78;margin-top:4px;font-weight:300}
.temp{font-size:7.5rem;font-weight:200;line-height:1;margin:18px 0 6px;display:flex}
.temp small{font-size:2.4rem;margin-top:14px;font-weight:300;opacity:.8}
.cond{font-size:1.35rem;font-weight:300;text-transform:capitalize}
.feels{opacity:.75;margin-top:4px;font-weight:300}
.iconbox{display:flex;align-items:center;justify-content:center}
.iconbox svg{width:min(100%,260px);height:auto;filter:drop-shadow(0 18px 24px rgba(10,15,25,.25));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.m{padding:20px;animation:rise .8s both;transition:.3s}
.m:hover{transform:translateY(-4px);background:rgba(20,28,40,.34)}
.m span{display:block;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.m b{display:block;font-size:1.9rem;font-weight:300;margin-top:8px}
.m i{font-style:normal;font-size:.9rem;opacity:.7;font-weight:300}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}
.bar u{display:block;height:100%;background:#f3e6cf;border-radius:4px;width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
h2{font-weight:300;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;opacity:.75;margin:28px 4px 12px}
.fcs{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.fc{padding:20px 14px;text-align:center;animation:rise .8s both;animation-delay:calc(.35s + var(--i)*.09s);transition:.3s}
.fc:hover{transform:translateY(-6px) scale(1.02);background:rgba(20,28,40,.36)}
.fc .d{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem}
.fc .dt{font-size:.78rem;opacity:.65;font-weight:300}
.fc svg{width:64px;height:64px;margin:10px 0 4px}
.fc .hi{font-size:1.5rem;font-weight:300}
.fc .lo{opacity:.65;font-weight:300}
.fc .rng{height:4px;border-radius:4px;background:rgba(255,255,255,.16);margin:12px 8px 0;position:relative}
.fc .rng u{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#9fc1d6,#f0c99a)}
.fc .pop{font-size:.78rem;opacity:.7;margin-top:8px;font-weight:300}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px;z-index:5;border-radius:26px}
.spin{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.22);border-top-color:#f6f3ee;animation:rot 1s linear infinite;position:relative}
.spin::after{content:"";position:absolute;inset:8px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-bottom-color:#f6f3ee;animation:rot 1.6s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.err{animation:shake .5s,rise .6s both}
.err h3{font-weight:300;font-size:1.6rem}
.err p{opacity:.8;max-width:420px;font-weight:300}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.ray{transform-origin:100px 100px;animation:rot 40s linear infinite}
.drop{animation:fall 1.1s linear infinite}
.drop:nth-child(2){animation-delay:-.3s}.drop:nth-child(3){animation-delay:-.7s}
@keyframes fall{from{transform:translateY(-14px);opacity:0}30%{opacity:1}to{transform:translateY(34px);opacity:0}}
.cl2{animation:sway 7s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(8px)}}
.bolt{animation:flash 3s infinite}
@keyframes flash{0%,88%,100%{opacity:1}90%{opacity:.2}93%{opacity:1}96%{opacity:.3}}
.foot{margin-top:30px;text-align:center;font-size:.78rem;opacity:.55;font-weight:300;letter-spacing:.08em}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:24px;text-align:center}.temp{justify-content:center;font-size:6rem}.metrics{grid-template-columns:repeat(2,1fr)}.fcs{grid-template-columns:repeat(2,1fr)}.fc:last-child{grid-column:1/-1}.brand{width:100%;text-align:center}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body class="clear">
<canvas id="fx"></canvas>
<div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="sunglow"></div>
<div class="wrap">
 <header>
  <div class="brand"><b>Sky</b>line</div>
  <form id="f" autocomplete="off">
   <div id="sw"><label class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search any city in the world…" aria-label="City" role="combobox" aria-autocomplete="list" aria-controls="sug"></label><ul id="sug" role="listbox"></ul></div>
   <button type="submit">Search</button>
   <button type="button" class="unit" id="u" title="Toggle units">°C</button>
  </form>
 </header>
 <div class="chips" id="chips"></div>
 <div id="app"></div>
 <p class="foot">LIVE DATA · OPENWEATHERMAP</p>
</div>

<script>
const KEY='200511302db13bd64a31911b1ca74dc4';
const API='https://api.openweathermap.org/data/2.5/';
const $=s=>document.querySelector(s), app=$('#app');
let data=null, metric=true;

/* ---------- storage helpers ---------- */
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- animated SVG icons ---------- */
const cloudPath='<path d="M62 150c-20 0-34-14-34-31 0-16 12-29 28-31 5-20 22-34 43-34 24 0 43 18 45 41 15 2 26 14 26 29 0 16-13 26-30 26z"';
function icon(main,night){
 const sun='<g class="ray"><g stroke="#f2d9a0" stroke-width="7" stroke-linecap="round">'+[...Array(8)].map((_,i)=>`<line x1="100" y1="22" x2="100" y2="40" transform="rotate(${i*45} 100 100)"/>`).join('')+'</g></g><circle cx="100" cy="100" r="40" fill="#f4dfae"/><circle cx="100" cy="100" r="40" fill="url(#sg)"/>';
 const moon='<path d="M128 40a62 62 0 1 0 38 100A70 70 0 0 1 128 40z" fill="#e8e4d4"/><circle cx="86" cy="104" r="7" fill="#cfc9b4"/><circle cx="108" cy="134" r="5" fill="#cfc9b4"/>';
 const cl=(c='#eef1f4',y=0)=>`<g class="cl2" transform="translate(0 ${y})">${cloudPath} fill="${c}"/></g>`;
 const dark='#b8c0cb';
 const drops=(c)=>'<g stroke="'+c+'" stroke-width="6" stroke-linecap="round">'+[70,100,130].map(x=>`<line class="drop" x1="${x}" y1="160" x2="${x-6}" y2="176"/>`).join('')+'</g>';
 let g;
 switch(main){
  case'Clear':g=night?moon:sun;break;
  case'Clouds':g=(night?'<g transform="translate(-24 -22) scale(.6)">'+moon+'</g>':'<g transform="translate(-30 -26) scale(.62)">'+sun+'</g>')+cl();break;
  case'Rain':case'Drizzle':g=cl(dark,-12)+drops('#a9c6dd');break;
  case'Thunderstorm':g=cl('#8d96a8',-12)+'<path class="bolt" d="M106 132l-18 30h14l-8 26 28-36h-15l10-20z" fill="#f2d9a0"/>';break;
  case'Snow':g=cl('#e3e9ef',-12)+'<g fill="#fff">'+[70,100,130].map(x=>`<circle class="drop" cx="${x}" cy="166" r="5"/>`).join('')+'</g>';break;
  default:g='<g stroke="#e6e6e0" stroke-width="8" stroke-linecap="round" opacity=".9"><line class="cl2" x1="44" y1="84" x2="156" y2="84"/><line x1="30" y1="112" x2="170" y2="112"/><line class="cl2" x1="50" y1="140" x2="150" y2="140"/></g>';
 }
 return `<svg viewBox="0 0 200 200"><defs><radialGradient id="sg"><stop offset="0" stop-color="#fff6dc" stop-opacity=".8"/><stop offset="1" stop-color="#f4dfae" stop-opacity="0"/></radialGradient></defs>${g}</svg>`;
}

/* ---------- theme + particles ---------- */
let fxMode='none';
function theme(main,night){
 const m=main==='Drizzle'?'Rain':main;
 const cls={Clear:'clear',Clouds:'clouds',Rain:'rain',Thunderstorm:'thunder',Snow:'snow'}[m]||'mist';
 document.body.className=cls+(night?' night':'');
 fxMode=m==='Rain'||m==='Thunderstorm'?'rain':m==='Snow'?'snow':(night&&m!=='Clouds'?'stars':night?'stars':'none');
 seed();
}
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);seed()}
function seed(){
 const n=fxMode==='rain'?170:fxMode==='snow'?110:fxMode==='stars'?120:0;
 P=[...Array(n)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:Math.random(),p:Math.random()*6}));
}
function loop(t){
 cx.clearRect(0,0,innerWidth,innerHeight);
 for(const o of P){
  if(fxMode==='rain'){
   o.y+=9+o.v*9;o.x-=1.6;if(o.y>innerHeight){o.y=-20;o.x=Math.random()*innerWidth+60}
   cx.strokeStyle=`rgba(205,220,235,${.22+o.v*.3})`;cx.lineWidth=1.2;cx.beginPath();cx.moveTo(o.x,o.y);cx.lineTo(o.x+2.5,o.y+14+o.v*10);cx.stroke();
  }else if(fxMode==='snow'){
   o.y+=.6+o.v*1.4;o.x+=Math.sin(t/1200+o.p)*.5;if(o.y>innerHeight){o.y=-6;o.x=Math.random()*innerWidth}
   cx.fillStyle=`rgba(255,255,255,${.5+o.v*.4})`;cx.beginPath();cx.arc(o.x,o.y,1.2+o.v*2.4,0,7);cx.fill();
  }else if(fxMode==='stars'){
   cx.fillStyle=`rgba(240,238,225,${.25+.55*Math.abs(Math.sin(t/1500+o.p))})`;cx.beginPath();cx.arc(o.x,o.y*.8,.6+o.v*1.2,0,7);cx.fill();
  }
 }
 requestAnimationFrame(loop);
}
addEventListener('resize',size);size();requestAnimationFrame(loop);

/* ---------- networking ---------- */
async function getJSON(url){
 let res;
 try{res=await fetch(url)}catch{throw new Error('network')}
 if(res.status===404)throw new Error('notfound');
 if(res.status===401)throw new Error('key');
 if(res.status===429)throw new Error('limit');
 if(!res.ok)throw new Error('server');
 return res.json();
}
async function fetchWeather(city,loc){
 const q=loc?`lat=${loc.latitude}&lon=${loc.longitude}`:`q=${encodeURIComponent(city.trim())}`;
 try{
  const [cur,fc]=await Promise.all([getJSON(`${API}weather?${q}&units=metric&appid=${KEY}`),getJSON(`${API}forecast?${q}&units=metric&appid=${KEY}`)]);
  if(loc){cur.name=loc.name;cur.sys.country=loc.country_code}setSrc('OpenWeatherMap');return{cur,fc};
 }catch(e){
  if(e.message==='key'||e.message==='limit'){const r=await fetchOpenMeteo(city,loc);setSrc('Open-Meteo (OpenWeatherMap key pending)');return r}
  throw e;
 }
}
const setSrc=n=>document.querySelector('.foot').textContent='LIVE DATA · '+n.toUpperCase();
const WMO={0:['Clear','clear sky'],1:['Clear','mainly clear'],2:['Clouds','partly cloudy'],3:['Clouds','overcast'],45:['Mist','fog'],48:['Mist','rime fog'],
 51:['Drizzle','light drizzle'],53:['Drizzle','drizzle'],55:['Drizzle','heavy drizzle'],56:['Drizzle','freezing drizzle'],57:['Drizzle','freezing drizzle'],
 61:['Rain','light rain'],63:['Rain','moderate rain'],65:['Rain','heavy rain'],66:['Rain','freezing rain'],67:['Rain','freezing rain'],
 71:['Snow','light snow'],73:['Snow','snow'],75:['Snow','heavy snow'],77:['Snow','snow grains'],80:['Rain','rain showers'],81:['Rain','rain showers'],82:['Rain','violent showers'],
 85:['Snow','snow showers'],86:['Snow','heavy snow showers'],95:['Thunderstorm','thunderstorm'],96:['Thunderstorm','thunderstorm with hail'],99:['Thunderstorm','severe thunderstorm']};
const wmo=c=>{const [main,description]=WMO[c]||['Clouds','cloudy'];return{main,description}};
async function fetchOpenMeteo(city,l){
 let loc=l;
 if(!loc){const g=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city.split(',')[0].trim())}&count=1&language=en`);
 if(!g.results||!g.results.length)throw new Error('notfound');
 loc=g.results[0]}
 const w=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,pressure_msl,wind_speed_10m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&hourly=visibility&forecast_hours=1&timezone=auto&forecast_days=6&wind_speed_unit=kmh`);
 const off=w.utc_offset_seconds,c=w.current,d=w.daily;
 const loc2u=iso=>Date.parse(iso+':00Z')/1000-off;
 const now=Math.floor(Date.now()/1000);
 const cur={name:loc.name,sys:{country:loc.country_code,sunrise:loc2u(d.sunrise[0]),sunset:loc2u(d.sunset[0])},dt:now,timezone:off,night:!c.is_day,
  weather:[wmo(c.weather_code)],main:{temp:c.temperature_2m,feels_like:c.apparent_temperature,temp_max:d.temperature_2m_max[0],temp_min:d.temperature_2m_min[0],humidity:c.relative_humidity_2m,pressure:Math.round(c.pressure_msl)},
  wind:{speed:c.wind_speed_10m/3.6},visibility:(w.hourly&&w.hourly.visibility&&w.hourly.visibility[0])||10000};
 const list=d.time.map((t,i)=>({dt:Date.parse(t+'T12:00:00Z')/1000-off,main:{temp_max:d.temperature_2m_max[i],temp_min:d.temperature_2m_min[i]},weather:[wmo(d.weather_code[i])],pop:(d.precipitation_probability_max[i]||0)/100}));
 return{cur,fc:{city:{timezone:off},list}};
}

/* ---------- helpers ---------- */
const T=c=>Math.round(metric?c:c*9/5+32);
const U=()=>metric?'°C':'°F';
const utc=(ts,off)=>new Date((ts+off)*1000);
function fiveDays(fc){
 const off=fc.city.timezone,days={};
 fc.list.forEach(e=>{const d=utc(e.dt,off),k=d.toISOString().slice(0,10);(days[k]??=[]).push({...e,hr:d.getUTCHours()})});
 const today=utc(Date.now()/1000,off).toISOString().slice(0,10);
 return Object.entries(days).filter(([k])=>k>=today).slice(0,5).map(([k,a])=>{
  const cnt={};a.forEach(e=>cnt[e.weather[0].main]=(cnt[e.weather[0].main]||0)+(e.hr>=9&&e.hr<=18?2:1));
  return{date:new Date(k+'T12:00:00Z'),hi:Math.max(...a.map(e=>e.main.temp_max)),lo:Math.min(...a.map(e=>e.main.temp_min)),main:Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0][0],pop:Math.max(...a.map(e=>e.pop||0))};
 });
}

/* ---------- views ---------- */
function loading(city){app.innerHTML=`<div class="overlay"><div class="spin"></div><div style="font-weight:300;letter-spacing:.1em">Reading the skies over ${esc(city)}…</div></div>`}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function error(kind,city){
 const msg={notfound:[`We couldn’t find “${esc(city)}”`,'Check the spelling, or try adding a country code, e.g. “Paris, FR”.'],
  network:['Can’t reach the weather service','Either you’re offline, or this page is running inside a sandboxed preview (like a chat window) that blocks outside requests. Download the file and open it directly in Chrome, Edge, Safari or Firefox.'],
  key:['API key not active yet','New OpenWeatherMap keys can take a couple of hours to activate. Please try again shortly.'],
  limit:['Too many requests','The weather service is rate-limiting us. Give it a minute.'],
  server:['The weather service is struggling','Something went wrong on their end. Please try again.']}[kind]||['Something went wrong','Please try again.'];
 app.innerHTML=`<div class="glass overlay err" style="position:relative;min-height:320px"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".85"><path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4 4 0 0 1 0 9z"/><path d="M12 11v3M12 16.5v.01"/></svg><h3>${msg[0]}</h3><p>${msg[1]}</p><button onclick="q.focus()" style="padding:10px 24px">Try another city</button>${kind==='network'?'<div style="opacity:.7;font-size:.85rem;margin-top:6px">Or preview the design with sample data:</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+['Clear','Clouds','Rain','Thunderstorm','Snow','Night'].map(k=>`<button class="chip" onclick="sample('${k}')">${k}</button>`).join('')+'</div>':''}</div>`;
}
function render(){
 const {cur,fc}=data,w=cur.weather[0],off=cur.timezone;
 const night=cur.night??(cur.dt<cur.sys.sunrise||cur.dt>cur.sys.sunset);
 theme(w.main,night);
 const now=utc(Date.now()/1000,off);
 const time=now.toLocaleString('en-US',{weekday:'long',hour:'numeric',minute:'2-digit',timeZone:'UTC'});
 const rise=utc(cur.sys.sunrise,off).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'UTC'});
 const set=utc(cur.sys.sunset,off).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'UTC'});
 const days=fiveDays(fc);
 const gmin=Math.min(...days.map(d=>d.lo)),gmax=Math.max(...days.map(d=>d.hi)),span=Math.max(gmax-gmin,1);
 const mets=[
  ['Humidity',cur.main.humidity,'%',cur.main.humidity],
  ['Wind',Math.round(cur.wind.speed*3.6),' km/h',Math.min(cur.wind.speed*3.6,100)],
  ['Pressure',cur.main.pressure,' hPa',Math.min(Math.max((cur.main.pressure-950)/1.2,4),100)],
  ['Visibility',cur.visibility==null?'—':(cur.visibility/1000).toFixed(1),cur.visibility==null?'':' km',cur.visibility==null?0:Math.min(cur.visibility/100,100)]];
 app.innerHTML=`
 <section class="glass hero">
  <div>
   <div class="city">${esc(cur.name)}, ${cur.sys.country||''}</div>
   <div class="sub">${time} · ☀ ${rise} · ☾ ${set}</div>
   <div class="temp">${T(cur.main.temp)}<small>${U()}</small></div>
   <div class="cond">${w.description}</div>
   <div class="feels">Feels like ${T(cur.main.feels_like)}° · H ${T(cur.main.temp_max)}° L ${T(cur.main.temp_min)}°</div>
  </div>
  <div class="iconbox">${icon(w.main,night)}</div>
 </section>
 <section class="metrics">${mets.map((m,i)=>`<div class="glass m" style="animation-delay:${.15+i*.08}s"><span>${m[0]}</span><b>${m[1]}<i>${m[2]}</i></b><div class="bar"><u data-w="${m[3]}"></u></div></div>`).join('')}</section>
 <h2>5-Day Forecast</h2>
 <section class="fcs">${days.map((d,i)=>`<div class="glass fc" style="--i:${i}">
  <div class="d">${i===0?'Today':d.date.toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'})}</div>
  <div class="dt">${d.date.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}</div>
  ${icon(d.main,false)}
  <div class="hi">${T(d.hi)}°</div><div class="lo">${T(d.lo)}°</div>
  <div class="rng"><u style="left:${(d.lo-gmin)/span*100}%;right:${100-(d.hi-gmin)/span*100}%"></u></div>
  <div class="pop">💧 ${Math.round(d.pop*100)}%</div></div>`).join('')}</section>`;
 requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.bar u').forEach(b=>b.style.width=b.dataset.w+'%'),100));
}
function chips(){
 const r=store.get('recent',[]);
 $('#chips').innerHTML=r.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){q.value=c;search(c)}};

/* ---------- offline sample data ---------- */
function sample(kind){
 const now=Math.floor(Date.now()/1000),night=kind==='Night',main=night?'Clear':kind;
 const desc={Clear:'clear sky',Clouds:'scattered clouds',Rain:'light rain',Thunderstorm:'thunderstorm',Snow:'light snow'}[main];
 const t=main==='Snow'?-2:main==='Rain'?19:24;
 const cur={name:'Sample City',sys:{country:'XX',sunrise:now-(night?50000:20000),sunset:now+(night?-10000:20000)},dt:now,timezone:0,
  weather:[{main,description:desc}],main:{temp:t,feels_like:t-2,temp_max:t+3,temp_min:t-4,humidity:68,pressure:1013},wind:{speed:4.2},visibility:9000};
 const mix=[main,'Clouds',main,'Rain','Clear'];
 const list=[...Array(40)].map((_,i)=>({dt:now+i*10800,main:{temp_max:t+3+Math.sin(i/3)*4,temp_min:t-4+Math.sin(i/3)*3},weather:[{main:mix[Math.floor(i/8)]}],pop:Math.abs(Math.sin(i/5))}));
 data={cur,fc:{city:{timezone:0},list}};render();
}

/* ---------- controller ---------- */
async function search(city,loc){
 city=city.trim();if(!city)return;
 hideSug();loading(city);
 try{
  data=await fetchWeather(city,loc);
  const r=[data.cur.name,...store.get('recent',[]).filter(x=>x.toLowerCase()!==data.cur.name.toLowerCase())].slice(0,5);
  store.set('recent',r);store.set('last',data.cur.name);chips();
  render();
 }catch(e){error(e.message,city)}
}
/* ---------- autocomplete ---------- */
let sugT,sugItems=[],sugI=-1,sugQ='';const sug=$('#sug');
function hideSug(){sug.classList.remove('on');sugI=-1}
function showSug(){
 sug.innerHTML=sugItems.length?sugItems.map((l,i)=>`<li role="option" data-i="${i}"><span><b>${esc(l.name)}</b><small>${esc([l.admin1,l.country].filter(Boolean).join(', '))}</small></span><em>${esc(l.country_code||'')}</em></li>`).join(''):'<li class="none">No matching places</li>';
 sugI=-1;sug.classList.add('on');
}
async function suggest(v){
 try{const g=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=en`);
  if(q.value.trim()!==v)return;sugItems=g.results||[];sugQ=v;showSug()}catch{hideSug()}
}
function pick(i){const l=sugItems[i];if(!l)return;q.value=l.name+(l.country_code?', '+l.country_code:'');search(l.name,l)}
function mark(){[...sug.children].forEach((li,i)=>li.classList.toggle('act',i===sugI))}
q.addEventListener('input',()=>{clearTimeout(sugT);const v=q.value.trim();if(v.length<2){hideSug();return}sugT=setTimeout(()=>suggest(v),250)});
q.addEventListener('keydown',e=>{
 if(!sug.classList.contains('on')||!sugItems.length)return;
 if(e.key==='ArrowDown'){e.preventDefault();sugI=(sugI+1)%sugItems.length;mark()}
 else if(e.key==='ArrowUp'){e.preventDefault();sugI=(sugI-1+sugItems.length)%sugItems.length;mark()}
 else if(e.key==='Escape')hideSug();
});
q.addEventListener('focus',()=>{if(sugItems.length&&q.value.trim().length>1)sug.classList.add('on')});
q.addEventListener('blur',()=>setTimeout(hideSug,150));
sug.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-i]');if(li){e.preventDefault();pick(+li.dataset.i)}});
$('#f').onsubmit=e=>{e.preventDefault();clearTimeout(sugT);const v=q.value.trim();
 if(sugI>=0)pick(sugI);
 else if(sugItems.length&&sugQ===v)pick(0);
 else search(v);
 q.blur()};
$('#u').onclick=()=>{metric=!metric;$('#u').textContent=metric?'°C':'°F';if(data)render()};
chips();
const first=store.get('last','Kochi');q.value=first;search(first);
</script>
</body>
</html>
