<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskflow</title>
<style>
:root{--bg:#f3f5f8;--sf:#fff;--sf2:#eaedf2;--ink:#1b2330;--mut:#667085;--ln:#dfe3ea;--ac:#2f5d8a;--acink:#fff;--chk:#fff;--sh:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.05);--c-work:#3d6fa5;--c-personal:#74609f;--c-shopping:#a2702d;--c-health:#3a8664;--c-learning:#a15a69;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151a;--sf:#1b1f26;--sf2:#252a33;--ink:#e7eaf0;--mut:#98a1b0;--ln:#2c323c;--ac:#7ea6d3;--acink:#10161e;--chk:#12151a;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--c-work:#7fa8d6;--c-personal:#a799d1;--c-shopping:#d1a262;--c-health:#6db692;--c-learning:#d08f9d;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12151a;--sf:#1b1f26;--sf2:#252a33;--ink:#e7eaf0;--mut:#98a1b0;--ln:#2c323c;--ac:#7ea6d3;--acink:#10161e;--chk:#12151a;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--c-work:#7fa8d6;--c-personal:#a799d1;--c-shopping:#d1a262;--c-health:#6db692;--c-learning:#d08f9d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body.dg{user-select:none;-webkit-user-select:none;cursor:grabbing}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:28px 16px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.025em}
.sub{margin:2px 0 0;color:var(--mut);font-size:14px}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--ln)}
.ring .fg{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:113.1;transition:stroke-dashoffset .8s cubic-bezier(.22,.8,.26,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);padding:10px 12px 12px;transition:border-color .2s}
.card:focus-within{border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:16px;padding:9px 4px;outline:0}
.btn{border:0;background:var(--ac);color:var(--acink);font-weight:600;padding:9px 20px;border-radius:10px;cursor:pointer;transition:transform .12s,opacity .15s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.95)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.card .chips{margin:4px 2px 0}
.chip{--c:var(--mut);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:transparent;color:var(--mut);font-size:13px;padding:4px 11px;border-radius:99px;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .12s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);transition:transform .25s}
.chip:hover{border-color:var(--c)}.chip:active{transform:scale(.94)}
.chip.on{color:var(--ink);border-color:var(--c);background:var(--sf2);background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip.on i{transform:scale(1.3)}
.chip small{opacity:.7;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 10px}
.search{flex:1 1 200px;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:0 12px;transition:border-color .2s}
.search:focus-within{border-color:var(--ac)}
.search svg{width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:16px;padding:9px 0;outline:0}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--sf2);border-radius:10px;padding:3px;flex:1 1 230px}
.th{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);background:var(--sf);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.14);transform:translateX(calc(var(--i,0)*100%));transition:transform .35s cubic-bezier(.22,.8,.26,1)}
.seg button{position:relative;border:0;background:none;color:var(--mut);font-size:13px;font-weight:600;padding:7px 4px;cursor:pointer;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg b{font-weight:500;opacity:.65;margin-left:5px}
#list{list-style:none;margin:14px 0 0;padding:0;position:relative}
.task{--c:var(--ac);position:relative;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:9px 8px 9px 4px;margin-bottom:8px;transition:border-color .2s,box-shadow .25s}
.task:hover{border-color:var(--c);border-color:color-mix(in srgb,var(--c) 50%,var(--ln))}
.task.lift{z-index:5;border-color:var(--c);box-shadow:0 14px 30px rgba(20,30,50,.2)}
.grip{flex:none;width:24px;height:30px;border:0;background:none;cursor:grab;touch-action:none;color:var(--mut);opacity:.4;display:grid;place-items:center;transition:opacity .2s}
.task:hover .grip,.grip:focus-visible,.lift .grip{opacity:1}
.grip svg{width:12px;height:16px;fill:currentColor}
.chk{flex:none;position:relative;width:24px;height:24px;border-radius:8px;border:1.8px solid var(--mut);background:transparent;cursor:pointer;padding:0;transition:background .25s,border-color .25s,transform .15s}
.chk:hover{border-color:var(--c)}.chk:active{transform:scale(.86)}
.chk svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--chk);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .35s .08s ease}
.done .chk{background:var(--c);border-color:var(--c)}
.done .chk svg{stroke-dashoffset:0}
.chk.pop::after{content:"";position:absolute;inset:-2px;border-radius:10px;border:2px solid var(--c);animation:rip .6s ease-out forwards}
@keyframes rip{from{opacity:.65;transform:scale(1)}to{opacity:0;transform:scale(2.1)}}
.body{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.txt{cursor:text;outline:0;overflow-wrap:anywhere;border-radius:4px;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.5px;transition:background-size .45s cubic-bezier(.22,.8,.26,1),color .3s}
.done .txt{background-size:100% 1.5px;color:var(--mut)}
.txt[contenteditable]{background:var(--sf2);box-shadow:0 0 0 4px var(--sf2);color:var(--ink)}
.tag{font-size:12px;font-weight:600;color:var(--c);padding:2px 9px;border-radius:99px;background:var(--sf2);background:color-mix(in srgb,var(--c) 13%,transparent);cursor:pointer;user-select:none;transition:transform .12s}
.tag:active{transform:scale(.93)}
.del{flex:none;width:30px;height:30px;border:0;border-radius:8px;background:none;color:var(--mut);cursor:pointer;opacity:0;display:grid;place-items:center;transition:opacity .2s,background .2s,color .2s}
.task:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:var(--sf2);color:#b4473f}
.del svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@media(hover:none){.del{opacity:.7}.grip{opacity:.6}}
#empty{display:none;text-align:center;color:var(--mut);padding:36px 12px}
#empty.show{display:block;animation:fade .45s both}
#empty svg{width:46px;height:46px;stroke:var(--mut);fill:none;stroke-width:1.5;stroke-linecap:round;margin-bottom:6px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;margin-top:8px;padding:0 4px}
.foot button{border:0;background:none;color:var(--ac);padding:4px 8px;border-radius:6px;cursor:pointer;transition:opacity .2s}
.foot button:disabled{opacity:.35;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:flex;gap:16px;align-items:center;box-shadow:var(--sh);transition:opacity .3s,transform .35s cubic-bezier(.22,.8,.26,1)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;font-weight:700;text-decoration:underline;cursor:pointer}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
<header class="top">
 <div><h1>Taskflow</h1><p class="sub" id="sub"></p></div>
 <div class="ring" title="Overall progress"><svg viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="18"/><circle class="fg" id="fg" cx="24" cy="24" r="18"/></svg><span id="pct">0%</span></div>
</header>
<form id="add" class="card" autocomplete="off">
 <div class="row"><input id="in" placeholder="Add a task and press Enter…" aria-label="New task" maxlength="200"><button class="btn">Add task</button></div>
 <div class="chips" id="addcats" role="radiogroup" aria-label="Category"></div>
</form>
<div class="bar">
 <label class="search"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17"/></svg><input id="q" placeholder="Search tasks (press /)" aria-label="Search tasks"></label>
 <div class="seg" id="seg"><i class="th"></i><button data-s="all">All<b></b></button><button data-s="active">Active<b></b></button><button data-s="done">Done<b></b></button></div>
</div>
<div class="chips" id="fcats"><button type="button" class="chip" data-c="" style="--c:var(--ac)"><i></i>All categories</button></div>
<ul id="list"></ul>
<div id="empty"><svg viewBox="0 0 48 48"><rect x="9" y="6" width="30" height="36" rx="5"/><path d="M17 18h14M17 26h14M17 34h8"/></svg><p id="et"></p></div>
<div class="foot"><span id="left"></span><button id="clr" type="button">Clear completed</button></div>
</main>
<div id="toast" role="status"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),KEY='taskflow.v1';
const CATS=[['work','Work'],['personal','Personal'],['shopping','Shopping'],['health','Health'],['learning','Learning']].map(([id,name])=>({id,name,v:`var(--c-${id})`}));
const catOf=id=>CATS.find(c=>c.id===id)||CATS[0];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const list=$('#list'),seg=$('#seg'),addChips=$('#addcats'),fChips=$('#fcats'),emptyEl=$('#empty');
let tasks=[]; // application state
const ui={status:'all',cats:[],cur:'work',q:''};
const els=new Map();let first=true,tg,tt;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get=id=>tasks.find(t=>t.id===id);

function saveToLocalStorage(){try{localStorage.setItem(KEY,JSON.stringify({tasks,ui:{status:ui.status,cats:ui.cats,cur:ui.cur}}))}catch(e){}}
function loadFromLocalStorage(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tasks)){tasks=d.tasks.filter(t=>t&&t.id&&typeof t.text==='string');Object.assign(ui,d.ui);return true}}catch(e){}return false}

if(!loadFromLocalStorage()){
 const s=(text,cat,done)=>({id:uid(),text,cat,done:!!done});
 tasks=[s('Review the Q4 project roadmap','work'),s('Pick up groceries for the week','shopping'),s('Book a dentist appointment','health',1),s('Finish the next course module','learning'),s('Call family this weekend','personal')];
 saveToLocalStorage();
}
if(!Array.isArray(ui.cats))ui.cats=[];
if(!CATS.some(c=>c.id===ui.cur))ui.cur='work';

function fx(el,kf,ms,done,delay){
 if(RM){done&&done();return}
 const a=el.animate(kf,{duration:ms,delay:delay||0,easing:'cubic-bezier(.22,.8,.26,1)',fill:done?'forwards':'backwards'});
 if(done)a.onfinish=done;
}
const shake=el=>fx(el,[{transform:'none'},{transform:'translateX(-7px)'},{transform:'translateX(6px)'},{transform:'translateX(-3px)'},{transform:'none'}],340);

CATS.forEach(c=>{
 addChips.insertAdjacentHTML('beforeend',`<button type="button" class="chip" role="radio" data-c="${c.id}" style="--c:${c.v}"><i></i>${c.name}</button>`);
 fChips.insertAdjacentHTML('beforeend',`<button type="button" class="chip" data-c="${c.id}" style="--c:${c.v}"><i></i>${c.name} <small></small></button>`);
});

function match(t){return(ui.status==='all'||(ui.status==='done')===!!t.done)&&(!ui.cats.length||ui.cats.includes(t.cat))&&(!ui.q||(t.text+' '+catOf(t.cat).name).toLowerCase().includes(ui.q))}
const nextLive=n=>{while(n&&n.classList.contains('out'))n=n.nextElementSibling;return n};

function build(){
 const li=document.createElement('li');li.className='task';
 li.innerHTML=`<button class="grip" type="button" aria-label="Reorder task (drag, or use arrow keys)" title="Drag to reorder"><svg viewBox="0 0 12 16"><circle cx="3.5" cy="3" r="1.3"/><circle cx="8.5" cy="3" r="1.3"/><circle cx="3.5" cy="8" r="1.3"/><circle cx="8.5" cy="8" r="1.3"/><circle cx="3.5" cy="13" r="1.3"/><circle cx="8.5" cy="13" r="1.3"/></svg></button><button class="chk" type="button" role="checkbox" aria-label="Complete task"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></button><div class="body"><span class="txt" tabindex="0" title="Click to edit"></span><span class="tag" title="Click to change category"></span></div><button class="del" type="button" aria-label="Delete task"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12"/></svg></button>`;
 return li;
}
function patch(li,t){
 const c=catOf(t.cat);
 li.style.setProperty('--c',c.v);
 li.classList.toggle('done',!!t.done);
 li.querySelector('.chk').setAttribute('aria-checked',!!t.done);
 const x=li.querySelector('.txt');if(x.textContent!==t.text&&!x.isContentEditable)x.textContent=t.text;
 li.querySelector('.tag').textContent=c.name;
}

function stats(){
 const n=tasks.length,d=tasks.filter(t=>t.done).length,p=n?d/n:0;
 $('#fg').style.strokeDashoffset=113.1*(1-p);
 $('#pct').textContent=Math.round(p*100)+'%';
 $('#sub').textContent=n?`${d} of ${n} completed`:'No tasks yet';
 const cnt={all:n,active:n-d,done:d};
 seg.querySelectorAll('button').forEach(b=>b.querySelector('b').textContent=cnt[b.dataset.s]);
 fChips.querySelectorAll('.chip[data-c]:not([data-c=""]) small').forEach(s=>s.textContent=tasks.filter(t=>t.cat===s.parentNode.dataset.c).length);
 $('#left').textContent=`${n-d} task${n-d===1?'':'s'} remaining`;
 $('#clr').disabled=!d;
}

function render(){
 const lr=list.getBoundingClientRect(),old=new Map();
 els.forEach((el,id)=>old.set(id,el.getBoundingClientRect()));
 const vis=tasks.filter(match),keep=new Set(vis.map(t=>t.id));
 els.forEach((el,id)=>{
  if(keep.has(id))return;
  const r=old.get(id);el.classList.add('out');
  Object.assign(el.style,{position:'absolute',top:r.top-lr.top+'px',left:'0',width:r.width+'px',margin:'0',pointerEvents:'none'});
  fx(el,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(16px) scale(.97)'}],240,()=>el.remove());
  els.delete(id);
 });
 let cur=nextLive(list.firstElementChild);
 vis.forEach((t,i)=>{
  let el=els.get(t.id);const fresh=!el;
  if(fresh){el=build();el.dataset.id=t.id;els.set(t.id,el)}
  patch(el,t);
  if(el===cur)cur=nextLive(cur.nextElementSibling);else list.insertBefore(el,cur);
  if(fresh)fx(el,[{opacity:0,transform:'translateY(-12px) scale(.98)'},{opacity:1,transform:'none'}],340,null,first?i*50:0);
 });
 vis.forEach(t=>{const el=els.get(t.id),o=old.get(t.id);if(!o)return;const d=o.top-el.getBoundingClientRect().top;if(Math.abs(d)>1)fx(el,[{transform:`translateY(${d}px)`},{transform:'none'}],340)});
 first=false;
 seg.style.setProperty('--i',['all','active','done'].indexOf(ui.status));
 seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===ui.status));
 addChips.querySelectorAll('.chip').forEach(b=>{const on=b.dataset.c===ui.cur;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
 fChips.querySelectorAll('.chip').forEach(b=>{const c=b.dataset.c;b.classList.toggle('on',c?ui.cats.includes(c):!ui.cats.length);b.setAttribute('aria-pressed',b.classList.contains('on'))});
 emptyEl.classList.toggle('show',!vis.length);
 $('#et').textContent=tasks.length?'No tasks match these filters. Try clearing the search or choosing another category.':'Nothing here yet. Add your first task above.';
 stats();
}

function toast(msg,undo){
 const el=$('#toast');el.textContent=msg;
 if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();el.classList.remove('show')};el.append(b)}
 el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),4500);
}

function toggle(li,t){
 t.done=!t.done;saveToLocalStorage();patch(li,t);
 const c=li.querySelector('.chk');
 if(t.done){c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');setTimeout(()=>c.classList.remove('pop'),650)}
 stats();clearTimeout(tg);
 if(match(t))render();else tg=setTimeout(render,750); // let the completion animation play before filtering out
}
function remove(t){
 const i=tasks.indexOf(t);tasks.splice(i,1);saveToLocalStorage();render();
 toast('Task deleted',()=>{tasks.splice(i,0,t);saveToLocalStorage();render()});
}
function edit(li){
 const x=li.querySelector('.txt'),t=get(li.dataset.id);
 x.contentEditable='plaintext-only';if(x.contentEditable!=='plaintext-only')x.contentEditable='true';
 x.focus();const r=document.createRange();r.selectNodeContents(x);const s=getSelection();s.removeAllRanges();s.addRange(r);
 const end=ok=>{x.removeEventListener('blur',onBlur);x.removeAttribute('contenteditable');const v=x.textContent.trim();if(ok&&v&&v!==t.text){t.text=v;saveToLocalStorage()}x.textContent=t.text};
 const onBlur=()=>end(true);
 x.addEventListener('blur',onBlur);
 x.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();x.blur()}else if(e.key==='Escape'){end(false);x.blur()}};
}

addChips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;ui.cur=b.dataset.c;saveToLocalStorage();render();$('#in').focus()};
fChips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const c=b.dataset.c;ui.cats=!c?[]:ui.cats.includes(c)?ui.cats.filter(x=>x!==c):[...ui.cats,c];saveToLocalStorage();render()};
seg.onclick=e=>{const b=e.target.closest('button');if(!b)return;ui.status=b.dataset.s;saveToLocalStorage();render()};
$('#q').oninput=e=>{ui.q=e.target.value.trim().toLowerCase();render()};
$('#add').onsubmit=e=>{
 e.preventDefault();const i=$('#in'),v=i.value.trim();
 if(!v){shake($('#add'));return}
 const t={id:uid(),text:v,cat:ui.cur,done:false};
 tasks.unshift(t);i.value='';
 if(!match(t)){ui.status='all';ui.cats=[];ui.q='';$('#q').value=''} // make sure the new task is visible
 saveToLocalStorage();render();
};
$('#clr').onclick=()=>{const prev=tasks;tasks=tasks.filter(t=>!t.done);saveToLocalStorage();render();toast(`Cleared ${prev.length-tasks.length} completed`,()=>{tasks=prev;saveToLocalStorage();render()})};

list.onclick=e=>{
 const li=e.target.closest('.task');if(!li)return;const t=get(li.dataset.id);
 if(e.target.closest('.chk'))toggle(li,t);
 else if(e.target.closest('.del'))remove(t);
 else if(e.target.closest('.tag')){t.cat=CATS[(CATS.findIndex(c=>c.id===t.cat)+1)%CATS.length].id;saveToLocalStorage();render()}
 else if(e.target.closest('.txt')&&!e.target.isContentEditable)edit(li);
};
list.addEventListener('keydown',e=>{
 if(e.target.isContentEditable)return;
 if(e.key==='Enter'&&e.target.matches('.txt'))return edit(e.target.closest('.task'));
 const g=e.target.closest('.grip');if(!g||!/^Arrow(Up|Down)$/.test(e.key))return;
 e.preventDefault();const li=g.closest('.task'),sb=nextLive(e.key==='ArrowUp'?li.previousElementSibling:li.nextElementSibling);
 if(!sb)return;const a=tasks.findIndex(t=>t.id===li.dataset.id),b=tasks.findIndex(t=>t.id===sb.dataset.id);
 [tasks[a],tasks[b]]=[tasks[b],tasks[a]];saveToLocalStorage();render();g.focus();
});

/* Drag-and-drop reordering (pointer events: mouse, touch and pen) */
let dg=null;
list.addEventListener('pointerdown',e=>{
 const g=e.target.closest('.grip');if(!g||e.button)return;
 const el=g.closest('.task'),items=[...list.children].filter(x=>!x.classList.contains('out'));
 dg={el,items,rects:items.map(x=>x.getBoundingClientRect()),from:items.indexOf(el),to:items.indexOf(el),y:e.clientY};
 items.forEach(x=>{if(x!==el)x.style.transition='transform .24s cubic-bezier(.22,.8,.26,1),border-color .2s'});
 el.classList.add('lift');document.body.classList.add('dg');
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
 e.preventDefault();
});
function mv(e){
 const d=dg;if(!d)return;const dy=e.clientY-d.y,r=d.rects[d.from];
 d.el.style.transform=`translateY(${dy}px) scale(1.02)`;
 const c=r.top+r.height/2+dy;let to=0;
 d.items.forEach((x,i)=>{if(i!==d.from&&d.rects[i].top+d.rects[i].height/2<c)to++});
 d.to=to;const sh=r.height+8;
 d.items.forEach((x,i)=>{if(i===d.from)return;x.style.transform=(d.from<to&&i>d.from&&i<=to)?`translateY(${-sh}px)`:(d.from>to&&i>=to&&i<d.from)?`translateY(${sh}px)`:''});
}
function up(){
 const d=dg;if(!d)return;dg=null;
 removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
 const {el,items,to}=d,t0=el.getBoundingClientRect().top;
 list.insertBefore(el,items.filter(x=>x!==el)[to]||null);
 items.forEach(x=>{x.style.transition='none';x.style.transform=''});
 el.classList.remove('lift');document.body.classList.remove('dg');
 const t1=el.getBoundingClientRect().top;
 if(!RM){el.style.transform=`translateY(${t0-t1}px)`;void el.offsetWidth;el.style.transition='transform .3s cubic-bezier(.22,.8,.26,1),border-color .2s';el.style.transform='';setTimeout(()=>el.style.transition='',320)}
 requestAnimationFrame(()=>items.forEach(x=>{if(x!==el)x.style.transition=''}));
 // write the new order back into the tasks array (works even while filters hide some tasks)
 const ids=[...list.children].filter(x=>x.dataset.id&&!x.classList.contains('out')).map(x=>x.dataset.id),slots=[];
 tasks.forEach((t,i)=>{if(ids.includes(t.id))slots.push(i)});
 const by=Object.fromEntries(tasks.map(t=>[t.id,t]));slots.forEach((s,k)=>tasks[s]=by[ids[k]]);
 saveToLocalStorage();
}

addEventListener('keydown',e=>{
 const a=document.activeElement,q=$('#q');
 if(e.key==='/'&&!/^(INPUT|TEXTAREA)$/.test(a.tagName)&&!a.isContentEditable){e.preventDefault();q.focus()}
 else if(e.key==='Escape'&&a===q){q.value='';ui.q='';render();q.blur()}
});

render();
})();
</script>
</body>
</html>
